<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沿線施設サーチャー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 h-screen flex flex-col text-gray-800 font-sans overflow-hidden">

    <header class="bg-blue-600 text-white p-4 shadow-md z-20 flex-shrink-0">
        <h1 class="text-xl font-bold flex items-center">
            <i class="fa-solid fa-route mr-2"></i> 沿線施設サーチャー
        </h1>
        <p class="text-xs text-blue-200 mt-1">駅の経路沿いにある目的の施設を一括検索（経路は道路ベースの近似）</p>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <div class="w-full md:w-96 bg-white shadow-lg z-10 flex flex-col h-full flex-shrink-0">
            <div class="p-4 border-b">
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">出発駅</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-train text-gray-400"></i></div>
                            <input type="text" id="origin" value="名鉄岐阜駅" class="pl-10 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">到着駅</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-flag-checkered text-gray-400"></i></div>
                            <input type="text" id="destination" value="塩釜口駅" class="pl-10 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <div class="flex-1">
                            <label class="block text-xs font-medium text-gray-500 mb-1">検索キーワード</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-magnifying-glass text-gray-400"></i></div>
                                <input type="text" id="keyword" value="本屋" class="pl-10 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition">
                            </div>
                        </div>
                        <div class="w-24">
                            <label class="block text-xs font-medium text-gray-500 mb-1">範囲 (m)</label>
                            <input type="number" id="radius" value="1000" step="100" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition text-right">
                        </div>
                    </div>
                    <button id="searchBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md shadow transition duration-200 flex justify-center items-center">
                        <i class="fa-solid fa-search mr-2"></i> 経路沿いを検索
                    </button>
                </div>
            </div>

            <div id="loading" class="hidden p-8 text-center text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-blue-500"></i>
                <p class="text-sm">検索中...</p>
            </div>

            <div id="resultsList" class="flex-1 overflow-y-auto p-2 bg-gray-50">
                <div class="h-full flex items-center justify-center text-gray-400 text-sm">検索ボタンを押して開始してください</div>
            </div>
        </div>

        <div class="flex-1 relative h-64 md:h-auto border-t md:border-t-0 md:border-l border-gray-200">
            <div id="map" class="w-full h-full"></div>
        </div>
    </main>

    <script>
        // Google Maps APIキー（自分のキーに置き換えてください）
        const API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY';

        // 検索地点の最大数（増やすと取りこぼしが減るが、API呼び出しも増える）
        const MAX_POINTS = 10;

        let map, directionsService, directionsRenderer, placesService, infoWindow;
        let markers = [];

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 35.1815, lng: 136.9066 },
                zoom: 11,
                mapTypeControl: false,
                streetViewControl: false,
            });
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({ map: map });
            placesService = new google.maps.places.PlacesService(map);
            infoWindow = new google.maps.InfoWindow();
            document.getElementById('searchBtn').addEventListener('click', performSearch);
        }

        function performSearch() {
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const keyword = document.getElementById('keyword').value;
            const radius = parseInt(document.getElementById('radius').value, 10);

            if (!origin || !destination || !keyword) {
                alert("出発駅、到着駅、検索キーワードを入力してください。");
                return;
            }

            toggleLoading(true);
            clearResults();

            // 日本ではTRANSIT(電車)の経路がAPIで取得できないため、車の経路で代用
            directionsService.route({
                origin: origin,
                destination: destination,
                travelMode: 'DRIVING'
            }, (response, status) => {
                if (status === 'OK') {
                    directionsRenderer.setDirections(response);

                    // 経路全体から等間隔に検索地点を取る
                    const path = response.routes[0].overview_path;
                    const n = Math.min(MAX_POINTS, path.length);
                    const searchPoints = [];
                    for (let i = 0; i < n; i++) {
                        const idx = n === 1 ? 0 : Math.round(i * (path.length - 1) / (n - 1));
                        searchPoints.push(path[idx]);
                    }
                    searchPlacesAlongRoute(searchPoints, keyword, radius);
                } else {
                    toggleLoading(false);
                    showError(`経路の検索に失敗しました: ${status}`);
                }
            });
        }

        async function searchPlacesAlongRoute(points, keyword, radius) {
            const allResults = [];
            const seenPlaceIds = new Set();
            let lastError = null;

            // レート制限を避けるため直列で実行
            for (const point of points) {
                try {
                    const results = await searchNearby(point, keyword, radius);
                    results.forEach(place => {
                        if (!seenPlaceIds.has(place.place_id)) {
                            seenPlaceIds.add(place.place_id);
                            allResults.push(place);
                        }
                    });
                } catch (err) {
                    lastError = err;
                    console.warn('Place search error:', err);
                }
            }

            toggleLoading(false);
            if (allResults.length === 0 && lastError) {
                showError(`施設検索に失敗しました: ${lastError}`);
                return;
            }
            renderResults(allResults);
        }

        function searchNearby(location, keyword, radius) {
            return new Promise((resolve, reject) => {
                placesService.nearbySearch({ location, radius, keyword }, (results, status) => {
                    if (status === 'OK' || status === 'ZERO_RESULTS') {
                        resolve(results || []);
                    } else {
                        reject(status);
                    }
                });
            });
        }

        function renderResults(places) {
            const listContainer = document.getElementById('resultsList');
            listContainer.innerHTML = '';

            if (places.length === 0) {
                listContainer.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-500">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
                        <p>条件に一致する施設が見つかりませんでした。</p>
                    </div>`;
                return;
            }

            const ul = document.createElement('ul');
            ul.className = 'space-y-2';

            places.forEach(place => {
                const li = document.createElement('li');
                li.className = 'bg-white p-3 rounded-lg border shadow-sm hover:shadow-md hover:border-blue-300 cursor-pointer transition flex flex-col';

                const ratingHtml = place.rating
                    ? `<span class="text-yellow-500 text-xs"><i class="fa-solid fa-star"></i> ${place.rating}</span>`
                    : '<span class="text-gray-400 text-xs">評価なし</span>';

                li.innerHTML = `
                    <div class="font-bold text-gray-800 truncate" title="${esc(place.name)}">${esc(place.name)}</div>
                    <div class="text-xs text-gray-500 mt-1 truncate"><i class="fa-solid fa-location-dot mr-1"></i>${esc(place.vicinity) || '住所不明'}</div>
                    <div class="mt-2">${ratingHtml}</div>`;

                const position = place.geometry.location;
                const marker = new google.maps.Marker({ map: map, position: position, title: place.name });
                markers.push(marker);

                const infoContent = `
                    <div class="text-sm font-bold text-gray-800 mb-1">${esc(place.name)}</div>
                    <div class="text-xs text-gray-600">${esc(place.vicinity)}</div>`;

                marker.addListener('click', () => {
                    infoWindow.setContent(infoContent);
                    infoWindow.open(map, marker);
                });

                li.addEventListener('click', () => {
                    map.panTo(position);
                    map.setZoom(15);
                    google.maps.event.trigger(marker, 'click');
                    document.querySelectorAll('#resultsList li').forEach(el => el.classList.remove('border-blue-500', 'bg-blue-50'));
                    li.classList.add('border-blue-500', 'bg-blue-50');
                });

                ul.appendChild(li);
            });

            listContainer.appendChild(ul);
        }

        function clearResults() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
            document.getElementById('resultsList').innerHTML = '';
            infoWindow.close();
        }

        function toggleLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
            document.getElementById('resultsList').classList.toggle('hidden', show);
        }

        function showError(msg) {
            const listContainer = document.getElementById('resultsList');
            listContainer.innerHTML = `
                <div class="p-4 bg-red-100 text-red-700 rounded-md border border-red-300">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> ${esc(msg)}
                </div>`;
            listContainer.classList.remove('hidden');
        }

        // Google Maps APIの読み込み
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places&callback=initMap`;
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
    </script>
</body>
</html>
